[package]
name = "backend-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"]}
chrono = { version = "0.4.45", features = ["serde"] }
validator = { version = "0.21.0", features = ["derive"] }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }

# All three already come in transitively via axum — declared here only so the
# test module can name them. `tower` drives the router directly (oneshot),
# `http-body-util` collects response bodies, `serde_json` builds and inspects
# the JSON the frontend actually exchanges.
[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.4"
serde_json = "1.0.151"
